# Render Infrastructure-as-Code Blueprint
# Deploy PostgreSQL, Backend API, and Next.js Web Frontend in 1-Click

services:
  # ─── 1. Backend Web Service ─────────────────────────────────
  - type: web
    name: devsync-api
    runtime: node
    buildCommand: npm install && npx prisma generate --schema=server/prisma/schema.prisma && npm run build:server
    startCommand: npx prisma migrate deploy --schema=server/prisma/schema.prisma && npm run start:server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: devsync-web
          property: host
          transform: https://{host}
      - key: STORAGE_PROVIDER
        value: local

  # ─── 2. Next.js Web Frontend ────────────────────────────────
  - type: web
    name: devsync-web
    runtime: node
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: devsync-api
          property: host
          transform: https://{host}
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: devsync-api
          property: host
          transform: https://{host}

# ─── 3. PostgreSQL Database ──────────────────────────────────
databases:
  - name: devsync-db
    databaseName: devsync
    user: devsync_user
    plan: free
